  <style>

    html, body {

    .den { padding-top: 2px; }
    .cross {
      position: relative;
      display: inline-block;
      padding: 0 2px;
    }
    .cross::after {
      content: "";
      position: absolute;
      left: -15%; top: 50%;
      width: 130%; height: 2px;
      background-color: #0066cc;
      transform: rotate(-45deg);
    }
    .cross .sub-num {
      position: absolute;
      font-size: 0.55em;
      color: #0066cc;
      font-weight: bold;
    }
    .num .cross .sub-num { top: -14px; right: -6px; }
    .den .cross .sub-num { bottom: -14px; right: -6px; }
    .scratchpad {
      margin-top: 20px;
      font-size: 0.75em;
      color: #222;
      line-height: 1.6;
    }
    .scratchpad-line { margin-bottom: 6px; }
