  <title>Math Practice</title>
  <style>
    * { box-sizing: border-box; user-select: none; }
    html, body {
      margin: 0; padding: 0; min-height: 100vh;
      background-color: #ffffff; color: #000000;
      font-family: 'Times New Roman', Times, serif;
      cursor: pointer;
    }
    #math-container {
      display: block;
      text-align: left;
      padding: 30px;
      font-size: min(5.5vw, 38px);
      line-height: 2.2;
      max-width: 1000px;
    }
    .frac {
      display: inline-flex;
      flex-direction: column;
      vertical-align: middle;
      text-align: center;
      padding: 0 4px;
      line-height: 1.1;
      font-size: 0.9em;
    }
    .num { border-bottom: 2px solid #000; padding-bottom: 2px; }
    .den { padding-top: 2px; }
    .cross {
      position: relative;
      display: inline-block;
      padding: 0 2px;
    }
    .cross::after {
      content: "";
      position: absolute;
      left: -15%; top: 50%;
      width: 130%; height: 2px;
      background-color: #0066cc;
      transform: rotate(-45deg);
    }
    .cross .sub-num {
      position: absolute;
      font-size: 0.55em;
      color: #0066cc;
      font-weight: bold;
    }
    .num .cross .sub-num { top: -14px; right: -6px; }
    .den .cross .sub-num { bottom: -14px; right: -6px; }
    .scratchpad {
      margin-top: 20px;
      font-size: 0.75em;
      color: #222;
      line-height: 1.6;
    }
    .scratchpad-line { margin-bottom: 6px; }
    #back-btn {
      position: fixed;
      left: 20px; bottom: 20px;
      width: 56px; height: 56px;
      border: 2px solid #ccc; border-radius: 50%;
      background: #fff; color: #888;
      font-size: 28px; line-height: 1;
      cursor: pointer;
    }
    #restart-btn {
      display: none;
      position: fixed;
      left: 88px; bottom: 20px;
      height: 56px; padding: 0 22px;
      border: 2px solid #ccc; border-radius: 28px;
      background: #fff; color: #888;
      font-family: inherit; font-size: 24px;
      cursor: pointer;
    }
    #back-btn:hover, #restart-btn:hover { border-color: #0066cc; color: #0066cc; }
  </style>
</head>

        ]
    ];

    let exIdx = 0;
    let stepIdx = 0;
    const container = document.getElementById("math-container");

    const backBtn = document.getElementById("back-btn");
    const restartBtn = document.getElementById("restart-btn");

    function render() {
      container.innerHTML = DATA[exIdx][stepIdx];
      const isFirst = exIdx === 0 && stepIdx === 0;
      const isLast = exIdx === DATA.length - 1 && stepIdx === DATA[exIdx].length - 1;
      backBtn.style.visibility = isFirst ? "hidden" : "visible";
      restartBtn.style.display = isLast ? "block" : "none";
    }

    function advance() {
      if (stepIdx < DATA[exIdx].length - 1) {
        stepIdx++;
      } else if (exIdx < DATA.length - 1) {
        exIdx++;
        stepIdx = 0;
      } else {
        return;
      }
      render();
    }

    // Step back; from the first step of an example, jump to the last step of the previous one
    function goBack() {
      if (stepIdx > 0) {
        stepIdx--;
      } else if (exIdx > 0) {
        exIdx--;
        stepIdx = DATA[exIdx].length - 1;
      } else {
        return;
      }
      render();
    }

    backBtn.addEventListener("pointerdown", (e) => {
      e.stopPropagation();
      if (e.button === 0) goBack();
    });

    restartBtn.addEventListener("pointerdown", (e) => {
      e.stopPropagation();
      if (e.button !== 0) return;
      exIdx = 0;
      stepIdx = 0;
      render();
    });

    window.addEventListener("pointerdown", (e) => {
      if (e.button === 0) advance();
    });
    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft" || e.key === "Backspace") goBack();
      else advance();
    });

    render();
  </script>
