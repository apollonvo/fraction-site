<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Math Practice</title>
  <style>
    * { box-sizing: border-box; user-select: none; }
    html, body {
      margin: 0; padding: 0; min-height: 100vh;
      background-color: #ffffff; color: #000000;
      font-family: 'Times New Roman', Times, serif;
      cursor: pointer;
    }
    #math-container {
      display: block;
      text-align: left;
      padding: 30px;
      font-size: min(5.5vw, 38px);
      line-height: 2.2;
      max-width: 1000px;
    }
    .frac {
      display: inline-flex;
      flex-direction: column;
      vertical-align: middle;
      text-align: center;
      padding: 0 4px;
      line-height: 1.1;
      font-size: 0.9em;
    }
    .num { border-bottom: 2px solid #000; padding-bottom: 2px; }
    .den { padding-top: 2px; }
    .cross {
      position: relative;
      display: inline-block;
      padding: 0 2px;
    }
    .cross::after {
      content: "";
      position: absolute;
      left: -15%; top: 50%;
      width: 130%; height: 2px;
      background-color: #0066cc;
      transform: rotate(-45deg);
    }
    .cross .sub-num {
      position: absolute;
      font-size: 0.55em;
      color: #0066cc;
      font-weight: bold;
    }
    .num .cross .sub-num { top: -14px; right: -6px; }
    .den .cross .sub-num { bottom: -14px; right: -6px; }
    .scratchpad {
      margin-top: 20px;
      font-size: 0.75em;
      color: #222;
      line-height: 1.6;
    }
    .scratchpad-line { margin-bottom: 6px; }
  </style>
</head>
<body>
  <div id="math-container"></div>

    let exIdx = 0;
    let stepIdx = 0;
    const container = document.getElementById("math-container");

    function render() {
      container.innerHTML = DATA[exIdx][stepIdx];
    }

    function advance() {
      if (stepIdx < DATA[exIdx].length - 1) {
        stepIdx++;
      } else {
        exIdx = (exIdx + 1) % DATA.length;
        stepIdx = 0;
      }
      render();
    }

    window.addEventListener("pointerdown", (e) => {
      if (e.button === 0) advance();
    });
    window.addEventListener("keydown", advance);

    render();
