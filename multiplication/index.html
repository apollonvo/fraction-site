  <style>

    html, body {

      font-family: 'Times New Roman', Times, serif;
      cursor: pointer;

    #math-container {

      font-size: 0.9em;

    .den { padding-top: 2px; }
    .cross {
      position: relative;
      display: inline-block;
      padding: 0 2px;
    }
    .cross::after {
      content: "";
      position: absolute;
      left: -15%; top: 50%;
      width: 130%; height: 2px;
      background-color: #0066cc;
      transform: rotate(-45deg);
    }
    .cross .sub-num {
      position: absolute;
      font-size: 0.55em;
      color: #0066cc;
      font-weight: bold;
    }
    .num .cross .sub-num { top: -14px; right: -6px; }
    .den .cross .sub-num { bottom: -14px; right: -6px; }
    .scratchpad {
      margin-top: 20px;
      font-size: 0.75em;
      color: #222;
      line-height: 1.6;
    }
    .scratchpad-line { margin-bottom: 6px; }

    let exIdx = 0;
    let stepIdx = 0;
    const container = document.getElementById("math-container");

    function render() {
      container.innerHTML = DATA[exIdx][stepIdx];
    }

    function advance() {
      if (stepIdx < DATA[exIdx].length - 1) {
        stepIdx++;
      } else {
        exIdx = (exIdx + 1) % DATA.length;
        stepIdx = 0;
      }
      render();
    }

    window.addEventListener("pointerdown", (e) => {
      if (e.button === 0) advance();
    });
    window.addEventListener("keydown", advance);

    render();
  </script>
</body>
</html>
